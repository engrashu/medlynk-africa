<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medlynk Africa — Connectez-vous à la Santé</title>
  <meta name="description" content="Trouvez vos médicaments, pharmacies et hôpitaux à Douala. Find medicines, pharmacies and hospitals in Douala.">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--green:#00C896;--dark:#0A2A24;--white:#FFFFFF;--gray:#F4F6F7;--text:#1A1A1A;--muted:#6B7280}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);line-height:1.6;background:var(--white)}
    .nav{position:fixed;top:0;width:100%;background:rgba(255,255,255,0.95);z-index:100;border-bottom:1px solid #eee}
    .nav-inner{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
    .logo{font-size:22px;font-weight:800;color:var(--dark);letter-spacing:-0.5px}
    .logo-dot{color:var(--green)}
    .lang-toggle{display:flex;gap:4px}
    .lang-btn{padding:6px 14px;border:1px solid #ddd;border-radius:20px;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:all 0.2s}
    .lang-btn.active{background:var(--dark);color:var(--white);border-color:var(--dark)}
    .hero{padding:130px 24px 70px;text-align:center;max-width:800px;margin:0 auto}
    .hero-badge{display:inline-block;padding:8px 20px;background:#E6FFF7;color:var(--dark);border-radius:24px;font-size:13px;font-weight:600;margin-bottom:24px}
    .hero h1{font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1.15;color:var(--dark);margin-bottom:20px;letter-spacing:-1px}
    .hero-sub{font-size:17px;color:var(--muted);max-width:580px;margin:0 auto 28px;line-height:1.6}
    .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:50px}
    .btn-primary{padding:14px 28px;background:var(--green);color:var(--white);border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
    .btn-secondary{padding:14px 28px;background:transparent;color:var(--dark);border:2px solid #ddd;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
    .hero-stats{display:flex;justify-content:center;gap:40px;flex-wrap:wrap}
    .stat-num{font-size:28px;font-weight:800;color:var(--dark)}
    .stat-label{font-size:12px;color:var(--muted)}
    .section{padding:70px 24px}
    .section-inner{max-width:1100px;margin:0 auto}
    .section-dark{background:var(--dark)}
    .section-green{background:var(--green)}
    .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
    .eyebrow.light{color:rgba(255,255,255,0.5)}
    .section h2{font-size:clamp(22px,4vw,36px);font-weight:800;line-height:1.2;color:var(--dark);margin-bottom:36px;letter-spacing:-0.5px}
    .section h2.light,.section p.light{color:var(--white)}
    .section p.light{font-size:17px;margin-bottom:28px;color:rgba(255,255,255,0.8)}
    .problem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
    .problem-card{padding:28px;background:var(--gray);border-radius:14px}
    .problem-icon{font-size:28px;margin-bottom:14px}
    .problem-card h3{font-size:17px;font-weight:700;margin-bottom:8px}
    .problem-card p{font-size:14px;color:var(--muted);line-height:1.6}
    .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
    .feature-card{padding:28px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:14px}
    .feature-num{width:34px;height:34px;background:var(--green);color:var(--white);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:14px}
    .feature-card h3{font-size:17px;font-weight:700;color:var(--white);margin-bottom:8px}
    .feature-card p{font-size:14px;color:rgba(255,255,255,0.6);line-height:1.6}
    .founder-info p{font-size:15px;color:var(--muted);margin-bottom:18px;line-height:1.7}
    .founder-list{list-style:none}
    .founder-list li{padding:8px 0;font-size:14px;color:var(--text);border-bottom:1px solid #eee}
    .founder-list li::before{content:"✓ ";color:var(--green);font-weight:700}
    .center{text-align:center}
    .waitlist-form{display:flex;gap:12px;justify-content:center;max-width:460px;margin:0 auto 14px;flex-wrap:wrap}
    .waitlist-form input{flex:1;min-width:200px;padding:14px 18px;border:2px solid rgba(255,255,255,0.3);border-radius:12px;background:rgba(255,255,255,0.15);color:var(--white);font-size:16px;outline:none}
    .waitlist-form input::placeholder{color:rgba(255,255,255,0.5)}
    .waitlist-form .btn-primary{background:var(--dark)}
    .waitlist-note{font-size:12px;color:rgba(255,255,255,0.5)}
    .footer{padding:36px 24px;background:var(--gray);text-align:center}
    .footer p{font-size:13px;color:var(--muted);margin-top:6px}
    .footer-copy{margin-top:16px;font-size:11px;color:#aaa}
    @media(max-width:640px){.hero{padding:110px 18px 50px}.section{padding:50px 18px}.waitlist-form{flex-direction:column}.waitlist-form input{min-width:100%}}
  </style>
</head>
<body>

  <nav class="nav"><div class="nav-inner">
    <div class="logo">Medlynk<span class="logo-dot">.</span></div>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="switchLang('fr')">FR</button>
      <button class="lang-btn" onclick="switchLang('en')">EN</button>
    </div>
  </div></nav>

  <section class="hero">
    <div class="hero-badge" data-fr="Bientôt disponible — Douala, Cameroun" data-en="Coming soon — Douala, Cameroon"></div>
    <h1 data-fr="Trouvez vos médicaments.<br>Sans perdre de temps." data-en="Find your medicines.<br>Without wasting time."></h1>
    <p class="hero-sub" data-fr="Medlynk connecte les patients aux pharmacies, cliniques et hôpitaux vérifiés à Douala — en temps réel, en français et en anglais." data-en="Medlynk connects patients to verified pharmacies, clinics and hospitals in Douala — in real time, in French and English."></p>
    <div class="hero-cta">
      <a href="#waitlist" class="btn-primary" data-fr="Rejoindre la liste d'attente" data-en="Join the waitlist"></a>
      <a href="#problem" class="btn-secondary" data-fr="En savoir plus" data-en="Learn more"></a>
    </div>
    <div class="hero-stats">
      <div class="stat"><div class="stat-num">15+</div><div class="stat-label" data-fr="Médicaments essentiels" data-en="Essential medicines"></div></div>
      <div class="stat"><div class="stat-num">+237</div><div class="stat-label" data-fr="Numéros camerounais" data-en="Cameroon numbers"></div></div>
      <div class="stat"><div class="stat-num">2</div><div class="stat-label" data-fr="Langues (FR/EN)" data-en="Languages (FR/EN)"></div></div>
    </div>
  </section>

  <section id="problem" class="section"><div class="section-inner">
    <div class="eyebrow" data-fr="Le problème" data-en="The problem"></div>
    <h2 data-fr="Un patient à Douala visite 3 à 5 pharmacies pour un seul médicament." data-en="A patient in Douala visits 3 to 5 pharmacies for a single medicine."></h2>
    <div class="problem-grid">
      <div class="problem-card"><div class="problem-icon">💊</div><h3 data-fr="Médicaments introuvables" data-en="Medicines unavailable"></h3><p data-fr="Aucun système ne permet de savoir quelle pharmacie a votre médicament en stock avant de vous déplacer." data-en="No system lets you know which pharmacy has your medicine in stock before you travel."></p></div>
      <div class="problem-card"><div class="problem-icon">🏥</div><h3 data-fr="Hôpitaux difficiles à localiser" data-en="Hospitals hard to locate"></h3><p data-fr="Les informations sur les cliniques, laboratoires et urgences sont dispersées et souvent obsolètes." data-en="Information about clinics, labs and emergencies is scattered and often outdated."></p></div>
      <div class="problem-card"><div class="problem-icon">⏱️</div><h3 data-fr="Temps et argent perdus" data-en="Time and money wasted"></h3><p data-fr="Chaque déplacement inutile coûte du transport, du temps et de l'énergie — surtout pour les familles à faible revenu." data-en="Every unnecessary trip costs transport, time and energy — especially for low-income families."></p></div>
    </div>
  </div></section>

  <section class="section section-dark"><div class="section-inner">
    <div class="eyebrow light" data-fr="La solution" data-en="The solution"></div>
    <h2 class="light" data-fr="Medlynk: cherchez, trouvez, guérissez." data-en="Medlynk: search, find, heal."></h2>
    <div class="features-grid">
      <div class="feature-card"><div class="feature-num">1</div><h3 data-fr="Cherchez un médicament" data-en="Search for a medicine"></h3><p data-fr="Tapez le nom en français ou anglais. Medlynk trouve les pharmacies qui l'ont en stock près de chez vous." data-en="Type the name in French or English. Medlynk finds pharmacies that have it in stock near you."></p></div>
      <div class="feature-card"><div class="feature-num">2</div><h3 data-fr="Voyez sur la carte" data-en="See on the map"></h3><p data-fr="Pharmacies, cliniques et hôpitaux vérifiés affichés sur une carte avec distance, prix et numéro de téléphone." data-en="Verified pharmacies, clinics and hospitals shown on a map with distance, price and phone number."></p></div>
      <div class="feature-card"><div class="feature-num">3</div><h3 data-fr="Obtenez l'itinéraire" data-en="Get directions"></h3><p data-fr="Directions vers la pharmacie ou l'hôpital le plus proche. Plus besoin de visiter 5 pharmacies." data-en="Directions to the nearest pharmacy or hospital. No more visiting 5 pharmacies."></p></div>
    </div>
  </div></section>

  <section class="section"><div class="section-inner">
    <div class="eyebrow" data-fr="Le fondateur" data-en="The founder"></div>
    <div class="founder-info">
      <h2 data-fr="Construit par quelqu'un qui a vu le problème." data-en="Built by someone who saw the problem."></h2>
      <p data-fr="Ashu Bertrand est un professionnel IT et leader communautaire basé à Douala. Après avoir vu un patient à l'hôpital incapable de trouver son médicament prescrit, il a fondé Medlynk pour que plus personne ne vive cette expérience." data-en="Ashu Bertrand is an IT professional and community leader based in Douala. After witnessing a patient at a hospital unable to find their prescribed medicine, he founded Medlynk so no one else has to face that experience."></p>
      <ul class="founder-list">
        <li data-fr="Diplôme en Informatique — Ensign College (GPA 3.97)" data-en="IT Degree — Ensign College (GPA 3.97)"></li>
        <li data-fr="Pasteur communautaire à Mambanda, Douala depuis 2019" data-en="Community pastor in Mambanda, Douala since 2019"></li>
        <li data-fr="Certifié IT Support & IT Professional" data-en="Certified IT Support & IT Professional"></li>
      </ul>
    </div>
  </div></section>

  <section id="waitlist" class="section section-green"><div class="section-inner center">
    <h2 class="light" data-fr="Soyez les premiers informés." data-en="Be the first to know."></h2>
    <p class="light" data-fr="Medlynk arrive bientôt à Douala. Laissez votre numéro et soyez parmi les premiers à l'utiliser." data-en="Medlynk is coming soon to Douala. Leave your number and be among the first to use it."></p>
    <div class="waitlist-form">
      <input type="tel" id="phone-input" placeholder="+237 6XX XXX XXX">
      <button class="btn-primary" onclick="submitWaitlist()" data-fr="Je m'inscris" data-en="Sign me up"></button>
    </div>
    <p class="waitlist-note" data-fr="Gratuit. Aucun spam. Juste une notification quand Medlynk est prêt." data-en="Free. No spam. Just a notification when Medlynk is ready."></p>
  </div></section>

  <footer class="footer"><div class="footer-inner">
    <div class="logo">Medlynk<span class="logo-dot">.</span></div>
    <p data-fr="Douala, Cameroun — Connecter l'accès aux soins de santé" data-en="Douala, Cameroon — Connecting Healthcare Access"></p>
    <p>founder@medlynk.me</p>
    <p class="footer-copy">© 2026 Medlynk Africa SARL</p>
  </div></footer>

  <script>
    let currentLang='fr';
    function switchLang(l){currentLang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));document.querySelector('.lang-btn[onclick="switchLang(\''+l+'\')"]').classList.add('active');document.documentElement.lang=l;document.querySelectorAll('[data-fr]').forEach(el=>{const t=el.getAttribute('data-'+l);if(el.tagName==='INPUT')el.placeholder=t;else if(el.tagName==='A'||el.tagName==='BUTTON')el.textContent=t;else el.innerHTML=t})}
    switchLang('fr');
    function submitWaitlist(){const p=document.getElementById('phone-input').value.trim();if(!p||p.length<9){alert(currentLang==='fr'?'Veuillez entrer un numéro valide':'Please enter a valid number');return}const b=document.querySelector('.waitlist-form .btn-primary');b.textContent=currentLang==='fr'?'Merci!':'Thank you!';b.style.background='#0A2A24';document.getElementById('phone-input').value='';setTimeout(()=>switchLang(currentLang),3000)}
  </script>

</body>
</html>
